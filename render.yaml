# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the @soundmate/app backend from the *workspace root* (NOT the package
# subfolder). Building one package from the repo root is required because:
#   - typescript / @types/node are root devDependencies (pnpm-hoisted), and
#   - @soundmate/app depends on @soundmate/common via `workspace:*`.
# The `pnpm build:app` script builds common first, then the app → dist/app.
#
# Node version comes from the repo-root `.node-version` (24.8.0), honored
# automatically because rootDir is the repo root.

services:
  - type: web
    name: soundmate-app
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build:app
    startCommand: pnpm --filter @soundmate/app start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Drives prod cookie behavior (SameSite=None; Secure) + `trust proxy`.
      - key: NODE_ENV
        value: production

      # --- Spotify app credentials (enter in the Render dashboard) ---
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      # Must be HTTPS in prod and match a Redirect URI registered in the Spotify
      # dashboard, e.g. https://soundmate-app.onrender.com/login/callback
      - key: SPOTIFY_REDIRECT_URI
        sync: false

      # Signs the session cookie. Generated once by Render and kept stable.
      - key: SESSION_SECRET
        generateValue: true

      # Post-login redirect target AND the allowed CORS origin — must be the
      # exact client origin (the static site URL). The two must be identical.
      - key: CLIENT_BASE_URL
        sync: false

      # Wired from the managed Key Value (Redis) instance below.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: soundmate-redis
          property: connectionString

  # ---------------------------------------------------------------------------
  # Static client (Lit + Vite). Built from the workspace root so @soundmate/common
  # builds first (`pnpm build:client`). Vite bundles everything into static assets,
  # so there is NO runtime node_modules — the app's dist/node_modules symlink trick
  # is not needed (and not wanted) here.
  - type: web
    name: soundmate-client
    runtime: static
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build:client
    staticPublishPath: ./dist/client
    autoDeploy: true
    # SPA fallback so client-side routes / deep links resolve to the app shell.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      # CSP must be set HERE (the app's security-headers middleware only covers API
      # responses now). Uncomment and replace <API-ORIGIN> with VITE_API_BASE_URL.
      # The directives below permit the Spotify Web Playback SDK + album art.
      # - path: /*
      #   name: Content-Security-Policy
      #   value: >-
      #     default-src 'self';
      #     script-src 'self' https://sdk.scdn.co;
      #     style-src 'self' 'unsafe-inline';
      #     img-src 'self' data: https://*.scdn.co https://*.spotifycdn.com;
      #     connect-src 'self' <API-ORIGIN> https://api.spotify.com https://*.spotify.com wss://*.spotify.com;
      #     frame-src https://sdk.scdn.co;
      #     base-uri 'self';
      #     frame-ancestors 'none'
    envVars:
      # Baked in at BUILD time (Vite inlines import.meta.env). Set this to the API
      # origin — the soundmate-app URL, e.g. https://soundmate-app.onrender.com.
      # The app's CLIENT_BASE_URL must equal THIS site's URL (it is both the
      # post-login redirect target and the allowed CORS origin).
      - key: VITE_API_BASE_URL
        sync: false

# Managed Redis (Render "Key Value") — backs express-session via connect-redis
# and the library repository. Internal-only (no public IP allow list).
  - type: keyvalue
    name: soundmate-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
